"Indus Valley Civilization":{hi:`सिंधु घाटी सभ्यता (हड़प्पा सभ्यता) कांस्य युग की नगरीय सभ्यता थी। इसके प्रमुख केंद्र हड़प्पा, मोहनजोदड़ो, धोलावीरा, लोथल, कालीबंगन आदि हैं। नगरों में नियोजित सड़कें, जल-निकासी, पक्की ईंटों का उपयोग और अलग-अलग आवासीय/सार्वजनिक क्षेत्र मिलते हैं। लोथल अपने प्राचीन बंदरगाह/डॉकयार्ड के लिए प्रसिद्ध है। धोलावीरा जल-संरक्षण व्यवस्था और नगर-योजना के लिए महत्वपूर्ण है। अर्थव्यवस्था कृषि, पशुपालन, शिल्प और व्यापार पर आधारित थी। मुहरें, मनके, धातु-कर्म और मृद्भांड प्रमुख पुरातात्त्विक साक्ष्य हैं। लिपि अभी निर्णायक रूप से पढ़ी नहीं गई है।`,en:`The Indus Valley or Harappan civilisation was a Bronze Age urban civilisation. Major sites include Harappa, Mohenjo-daro, Dholavira, Lothal and Kalibangan. Cities show planned streets, drainage, baked-brick construction and organised residential/public spaces. Lothal is associated with a dockyard, while Dholavira is noted for water-management and town planning. The economy involved agriculture, pastoralism, crafts and trade. Seals, beads, metalwork and pottery are major archaeological evidence. The script remains undeciphered.`,qs:[['Which site is associated with a dockyard?','Lothal'],['Which civilisation is also called Harappan civilisation?','Indus Valley Civilization'],['Dholavira is especially noted for?','Water management and town planning']]},
"Percentage":{hi:`प्रतिशत का अर्थ है प्रति सौ। यदि किसी संख्या का x% निकालना हो तो x/100 से गुणा करें। प्रतिशत वृद्धि या कमी में पुराना मान आधार होता है।`,en:`Percentage means per hundred. To find x% of a number, multiply by x/100. For percentage increase or decrease, the original value is the base.`,qs:[['25% of 240 = ?','60'],['200 से 250 होने पर वृद्धि कितनी है?','25%'],['40, 160 का कितने प्रतिशत है?','25%']]},
"Average":{hi:`औसत = सभी मानों का योग ÷ मानों की संख्या। औसत और संख्या ज्ञात हो तो कुल योग = औसत × संख्या। प्रतिस्थापन वाले प्रश्नों में कुल योग के बदलाव पर ध्यान दें।`,en:`Average equals total sum divided by number of observations. If average and count are known, total equals average multiplied by count. In replacement questions, track the change in total.`,qs:[['10,20,30 का औसत?','20'],['5 संख्याओं का औसत 18 है, योग?','90'],['4,8,12,16 का औसत?','10']]},
"Profit & Loss":{hi:`लाभ = विक्रय मूल्य − क्रय मूल्य। हानि = क्रय मूल्य − विक्रय मूल्य। सामान्यतः लाभ% और हानि% का आधार क्रय मूल्य होता है।`,en:`Profit equals selling price minus cost price. Loss equals cost price minus selling price. Profit and loss percentages are normally calculated on cost price.`,qs:[['CP ₹500, SP ₹600: लाभ%?','20%'],['CP ₹800, हानि ₹80: हानि%?','10%'],['CP ₹1000 और लाभ 15%: SP?','₹1150']]},
"Simple Interest":{hi:`साधारण ब्याज SI = P×R×T/100। कुल राशि = मूलधन + साधारण ब्याज। P मूलधन, R वार्षिक दर और T वर्षों में समय है।`,en:`Simple Interest = P×R×T/100. Amount equals principal plus simple interest. P is principal, R annual rate and T time in years.`,qs:[['P=1000,R=10%,T=2: SI?','200'],['SI=300,P=1500,T=2: R?','10%'],['P=2000,R=5%,T=3: Amount?','2300']]},
"Number System":{hi:`संख्या पद्धति में प्राकृतिक, पूर्ण, पूर्णांक, परिमेय संख्याएँ, अभाज्य/भाज्य संख्याएँ, गुणनखंड, गुणज, HCF और LCM आते हैं। दो धनात्मक पूर्णांकों के लिए HCF×LCM = दोनों का गुणनफल।`,en:`Number-system questions cover natural, whole, integer and rational numbers, primes, factors, multiples, HCF and LCM. For two positive integers, HCF multiplied by LCM equals their product.`,qs:[['पहली अभाज्य संख्या?','2'],['12 और 18 का HCF?','6'],['4 और 6 का LCM?','12']]},
"Series":{hi:`श्रृंखला में पदों के बीच नियम खोजें। पहले अंतर, फिर गुणा/भाग और फिर वैकल्पिक पदों के पैटर्न देखें।`,en:`In a series, identify the rule between terms. Check differences first, then multiplication/division, and finally alternating positions.`,qs:[['2,4,6,8, ?','10'],['3,6,12,24, ?','48'],['5,10,15,20, ?','25']]},
"Coding-Decoding":{hi:`कोडिंग-डिकोडिंग में अक्षर/संख्या पर कोई नियम लागू किया जाता है। अक्षर की स्थिति, आगे-पीछे शिफ्ट और वैकल्पिक नियमों को जाँचें।`,en:`Coding-decoding assigns a rule to letters, numbers or words. Check alphabet positions, forward/backward shifts and alternating rules.`,qs:[['CAT → DBU, तो DOG → ?','EPH'],['A=1,B=2,... तो C+O+D+E?','27'],['हर अक्षर एक कदम आगे: BAT → ?','CBU']]},
"Direction Sense":{hi:`दिशा प्रश्नों में उत्तर, दक्षिण, पूर्व और पश्चिम को स्थिर संदर्भ मानें। कई मोड़ हों तो छोटा-सा नक्शा बनाएं।`,en:`Use North, South, East and West as fixed references. For several turns, draw a small path diagram.`,qs:[['उत्तर की ओर देखकर दायाँ मुड़ें?','पूर्व'],['पूर्व की ओर देखकर बायाँ मुड़ें?','उत्तर'],['दक्षिण की विपरीत दिशा?','उत्तर']]},
"Blood Relations":{hi:`रक्त संबंध प्रश्नों में परिवार वृक्ष बनाना सबसे सुरक्षित तरीका है। पीढ़ी और लिंग को अलग-अलग चिन्हित करें।`,en:`For blood-relations questions, draw a family tree and track generation and gender carefully.`,qs:[['पिता के पिता?','दादा/Grandfather'],['बहन की बेटी?','भांजी/Niece'],['माँ का बेटा (स्वयं को छोड़कर)?','भाई/Brother']]},
"Indian Polity":{hi:`भारतीय राजव्यवस्था में संविधान, प्रस्तावना, मौलिक अधिकार, नीति-निर्देशक तत्व, संसद, राष्ट्रपति, मंत्रिपरिषद, न्यायपालिका और संवैधानिक निकाय आते हैं। मौलिक अधिकार भाग III और नीति-निर्देशक तत्व भाग IV में हैं।`,en:`Indian Polity covers the Constitution, Preamble, Fundamental Rights, Directive Principles, Parliament, President, Council of Ministers, Judiciary and constitutional bodies. Fundamental Rights are in Part III and Directive Principles in Part IV.`,qs:[['मौलिक अधिकार किस भाग में हैं?','Part III'],['नीति-निर्देशक तत्व किस भाग में हैं?','Part IV'],['संघ का संवैधानिक प्रमुख?','President']]},
"Indian History":{hi:`भारतीय इतिहास को प्राचीन, मध्यकालीन और आधुनिक काल में क्रम से पढ़ें। परीक्षा के लिए घटनाओं के कारण, परिणाम, तिथियाँ, स्थान और प्रमुख व्यक्तियों को जोड़कर पढ़ना उपयोगी है। 1857 का विद्रोह आधुनिक भारत का प्रमुख मोड़ था।`,en:`Study Indian history chronologically across ancient, medieval and modern periods. For exams, connect causes, consequences, dates, places and personalities. The Revolt of 1857 is a major event in modern Indian history.`,qs:[['कलिंग युद्ध किससे जुड़ा है?','Ashoka'],['1857 का विद्रोह कहाँ से शुरू हुआ?','Meerut'],['हड़प्पा स्थल लोथल किसके लिए प्रसिद्ध है?','Dockyard']]},
"Indian Geography":{hi:`भारतीय भूगोल में स्थलाकृति, नदियाँ, पर्वत, जलवायु, मिट्टी, कृषि, खनिज, उद्योग, जनसंख्या और परिवहन पढ़ें। मानसून भारतीय जलवायु और कृषि में महत्वपूर्ण है।`,en:`Indian Geography covers relief, rivers, mountains, climate, soils, agriculture, minerals, industries, population and transport. The monsoon is central to India's climate and agriculture.`,qs:[['भारत की प्रमुख पर्वत प्रणाली?','Himalayas'],['मुख्य वर्षा ऋतु?','Southwest monsoon'],['कपास से जुड़ी प्रमुख मिट्टी?','Black soil']]},
"General Science":{hi:`सामान्य विज्ञान में भौतिकी, रसायन और जीवविज्ञान की आधारभूत अवधारणाएँ तथा दैनिक जीवन में उनका उपयोग शामिल है।`,en:`General Science combines basic Physics, Chemistry and Biology with everyday applications.`,qs:[['जीवन की मूल इकाई?','Cell'],['बल की SI इकाई?','Newton'],['मानव श्वसन के लिए आवश्यक गैस?','Oxygen']]},
"Grammar":{hi:`व्याकरण में शब्द-भेद, काल, subject-verb agreement, articles, prepositions, voice, narration और sentence correction प्रमुख हैं।`,en:`Grammar covers parts of speech, tense, subject-verb agreement, articles, prepositions, voice, narration and sentence correction.`,qs:[['He ___ to school daily.','goes'],['write का past tense?','wrote'],['___ apple: सही article?','an']]},
"Vocabulary":{hi:`शब्दावली में शब्दों के अर्थ, पर्यायवाची, विलोम और संदर्भानुसार प्रयोग सीखें। केवल सूची रटने के बजाय उदाहरण वाक्यों में शब्दों को देखें।`,en:`Vocabulary includes meanings, synonyms, antonyms and contextual usage. Learn words through example sentences rather than isolated lists only.`,qs:[['rapid का synonym?','fast'],['ancient का antonym?','modern'],['brief का अर्थ?','short']]},
"Reading Comprehension":{hi:`गद्यांश में पहले मुख्य विचार समझें, फिर प्रश्न के लिए उसी अनुच्छेद में प्रमाण खोजें। बाहर की जानकारी जोड़कर उत्तर न दें जब तक प्रश्न ऐसा न मांगे।`,en:`Read for the main idea, then locate evidence in the passage. Do not add outside information unless the question requires it.`,qs:[['उत्तर किस पर आधारित होना चाहिए?','Passage information'],['Main idea क्या है?','Central idea'],['क्या असमर्थित बाहरी तथ्य जोड़ना चाहिए?','No']]},
"Algebra":{hi:`बीजगणित में चर और समीकरणों से अज्ञात राशियों को व्यक्त किया जाता है। समीकरण के दोनों पक्षों पर समान क्रिया करें और अंतिम उत्तर को जाँचें।`,en:`Algebra uses variables and equations to represent unknowns. Apply the same operation to both sides and check the final value in the original equation.`,qs:[['x+5=12 तो x?','7'],['2x=18 तो x?','9'],['x=3: x²+2x?','15']]},
"Geometry":{hi:`ज्यामिति में रेखाएँ, कोण, त्रिभुज, चतुर्भुज, वृत्त और उनके गुण आते हैं। त्रिभुज के कोणों का योग 180° और एक बिंदु के चारों ओर कोणों का योग 360° होता है।`,en:`Geometry covers lines, angles, triangles, quadrilaterals, circles and their properties. Triangle angles sum to 180°, while angles around a point sum to 360°.`,qs:[['त्रिभुज के कोणों का योग?','180°'],['समकोण?','90°'],['एक बिंदु के चारों ओर?','360°']]},
"Time & Work":{hi:`कार्य प्रश्नों में rate का उपयोग करें। यदि कोई व्यक्ति x दिनों में काम करता है तो एक दिन का काम 1/x होगा। संयुक्त दरें जोड़ी जाती हैं।`,en:`Use work rates. If a person completes a job in x days, one-day work is 1/x. Combined rates are added.`,qs:[['10 दिनों में काम: one-day work?','1/10'],['1/10 और 1/15 की combined rate?','1/6'],['1/5 प्रति दिन rate: समय?','5 days']]},
"Time & Distance":{hi:`दूरी = चाल × समय। गणना से पहले इकाइयाँ समान करें।`,en:`Distance equals speed multiplied by time. Keep units consistent before calculating.`,qs:[['60 km/h for 2 h: distance?','120 km'],['120 km in 3 h: speed?','40 km/h'],['30 km/h पर 90 km: time?','3 h']]},
"RBI":{hi:`भारतीय रिज़र्व बैंक भारत का केंद्रीय बैंक है। मौद्रिक नीति, बैंकिंग विनियमन/पर्यवेक्षण, मुद्रा और भुगतान प्रणाली से जुड़े कार्य परीक्षा में महत्वपूर्ण हैं।`,en:`The Reserve Bank of India is India's central bank. Monetary policy, banking regulation/supervision, currency management and payment systems are important exam areas.`,qs:[['RBI का full form?','Reserve Bank of India'],['RBI किस देश का central bank है?','India'],['RBI का एक प्रमुख कार्य?','Monetary policy / banking regulation']]},
"Environment":{hi:`पर्यावरण में पारितंत्र, जैव विविधता, प्रदूषण, जलवायु परिवर्तन, संरक्षण और संसाधनों का सतत उपयोग शामिल है।`,en:`Environment covers ecosystems, biodiversity, pollution, climate change, conservation and sustainable resource use.`,qs:[['जीवों की विविधता?','Biodiversity'],['प्रकाश संश्लेषण में पौधे किस गैस का उपयोग करते हैं?','Carbon dioxide'],['पृथ्वी के औसत तापमान में दीर्घकालीन वृद्धि?','Global warming']]},
"Ethics":{hi:`नैतिकता में सत्यनिष्ठा, निष्पक्षता, वस्तुनिष्ठता, सहानुभूति, जवाबदेही और लोकसेवा के मूल्य आते हैं।`,en:`Ethics covers integrity, impartiality, objectivity, empathy, accountability and public-service values.`,qs:[['Integrity का मुख्य अर्थ?','Honest and consistent conduct'],['Evidence-based impartial judgement?','Objectivity'],['दूसरे के दृष्टिकोण/भावना को समझना?','Empathy']]} };
const aliases={"History":"Indian History","Arithmetic":"Percentage","Interest":"Simple Interest","SI CI":"Simple Interest","Physics":"General Science","Chemistry":"General Science","Biology":"General Science","Life Science":"General Science","Reasoning":"Series","Logical Reasoning":"Series","Language I":"Grammar","Language II":"Grammar","Hindi":"Grammar"};
let lang='hi',exam='',subject='',topic='',part='theory',lesson=0,timer=null;
function arg(s){return encodeURIComponent(String(s))}
function val(s){return decodeURIComponent(s)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function subjectsOf(e){return Object.fromEntries(E[e].map(x=>{let [s,t]=x.split('|');return [s,t.split(',')]}))}
function home(){exam='';subject='';topic='';render()}
function openExam(e){exam=e;subject='';topic='';render()}
function openSubject(s){subject=s;topic='';render()}
function openTopic(t){topic=t;part='theory';lesson=0;render()}
function data(){let key=common[topic]?topic:(aliases[topic]||''); if(common[key])return common[key]; let base=topic; return {hi:`यह ${base} अध्याय है। इसे परीक्षा के संदर्भ में परिभाषा, मुख्य अवधारणाएँ, उदाहरण, अपवाद और प्रश्न-अभ्यास के साथ पढ़ें। इस पेज पर दी गई सामग्री को जानबूझकर संक्षिप्त रखा गया है जहाँ विस्तृत chapter text अभी जोड़ा नहीं गया है।`,en:`This is the ${base} chapter. Study it through definition, core concepts, examples, exceptions and practice. This page is intentionally marked as an outline where a full chapter text has not yet been added.`,qs:[[`${base} का अध्ययन कैसे करें?`,'Definition → concept → examples → practice'],['Latest pattern कहाँ verify करें?','Official notification']]}}
function render(){const a=document.getElementById('app');if(!exam)return renderHome(a);if(!subject)return renderExam(a);if(!topic)return renderSubject(a);return renderTopic(a)}
function renderHome(a){a.innerHTML=`<div class="box"><h2>🎯 Government Exams</h2><p>31 major exam tracks • bilingual topic view • topic-linked MCQs • revision • AI Teacher lesson</p><div class="warn">⚠️ Syllabus/pattern/date/fee/vacancy में latest बदलाव के लिए संबंधित official notification को final source मानें.</div></div><div class="grid">${Object.keys(E).map(x=>`<div class="card" onclick="openExam(val('${arg(x)}'))"><h3>${esc(x)}</h3><p>${E[x].length} subject groups</p></div>`).join('')}</div>`}
function renderExam(a){let S=subjectsOf(exam);a.innerHTML=`<button class="btn dark" onclick="home()">← Home</button><div class="box"><h2>${esc(exam)}</h2><p>Subject-wise syllabus topics</p></div><div class="grid">${Object.entries(S).map(([s,t])=>`<div class="card" onclick="openSubject(val('${arg(s)}'))"><h3>${esc(s)}</h3><p>${t.length} topics</p></div>`).join('')}</div>`}
function renderSubject(a){let T=subjectsOf(exam)[subject]||[];a.innerHTML=`<button class="btn dark" onclick="openExam(val('${arg(exam)}'))">← ${esc(exam)}</button><div class="box"><h2>${esc(subject)}</h2><p class="small">Har topic ka theory/MCQ/revision section kholen.</p></div>${T.map((t,i)=>`<div class="topic" onclick="openTopic(val('${arg(t)}'))"><b>${i+1}. ${esc(t)}</b><div class="small">Theory • MCQ • Important • Formula/Rules • Revision • AI Teacher</div></div>`).join('')}`}
function renderTopic(a){let d=data(), text=lang==='hi'?d.hi:d.en;let qs=d.qs||[];a.innerHTML=`<button class="btn dark" onclick="openSubject(val('${arg(subject)}'))">← ${esc(subject)}</button><div class="box"><div><span class="pill">${esc(exam)}</span><span class="pill">${esc(subject)}</span></div><h2>${esc(topic)}</h2><button class="btn ghost" onclick="setLang('hi')">हिंदी</button><button class="btn ghost" onclick="setLang('en')">English</button></div><div class="tabs">${[['theory','📖 Theory'],['mcq','📝 MCQ'],['important','⭐ Important'],['revision','⚡ Revision'],['teacher','🎓 AI Teacher']].map(x=>`<button class="tab ${part===x[0]?'on':''}" onclick="setPart('${x[0]}')">${x[1]}</button>`).join('')}</div>${part==='theory'?`<div class="box note hand"><h3>📖 Chapter Theory</h3><p>${esc(text)}</p>${diagram(topic)}</div>`:''}${part==='mcq'?mcqs(qs):''}${part==='important'?`<div class="box"><h3>⭐ Important Points</h3><ul><li>Definition और core concept revise करें.</li><li>मुख्य facts/formulas को short revision list में रखें.</li><li>गलत MCQs का error-log बनाएं.</li><li>Exam-specific latest pattern official notification से verify करें.</li></ul></div>`:''}${part==='revision'?`<div class="box"><h3>⚡ 5-Minute Revision</h3><ol><li>1 min — definition</li><li>1 min — key facts/formula</li><li>1 min — examples</li><li>1 min — MCQ</li><li>1 min — error-log</li></ol></div>`:''}${part==='teacher'?teacher(d):''}`}
function diagram(t){if(t==='Indus Valley Civilization')return `<div class="diagram"><b>Simple town-plan figure</b><svg width="100%" height="180" viewBox="0 0 600 180"><rect x="20" y="20" width="560" height="140" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="20" y1="65" x2="580" y2="65" stroke="#64748b" stroke-width="3"/><line x1="20" y1="110" x2="580" y2="110" stroke="#64748b" stroke-width="3"/><line x1="170" y1="20" x2="170" y2="160" stroke="#64748b" stroke-width="3"/><line x1="350" y1="20" x2="350" y2="160" stroke="#64748b" stroke-width="3"/><text x="30" y="50" fill="#172033">planned streets</text><text x="30" y="98" fill="#172033">drainage</text><text x="30" y="145" fill="#172033">residential/public blocks</text></svg></div>`;if(t==='Direction Sense')return `<div class="diagram"><b>Direction compass</b><div style="font-size:46px;text-align:center">⬆️ N &nbsp; ➡️ E &nbsp; ⬇️ S &nbsp; ⬅️ W</div></div>`;if(t==='Percentage')return `<div class="diagram"><b>Percentage idea</b><div style="height:28px;background:#dbeafe;border-radius:8px;overflow:hidden"><div style="width:25%;height:100%;background:#2563eb"></div></div><p>25% = 25 out of 100</p></div>`;return ''}
function mcqs(qs){return `<div class="box"><h3>📝 Topic-linked MCQs</h3>${qs.map((q,i)=>`<div class="mcq"><b>Q${i+1}. ${esc(q[0])}</b><br><button class="btn ghost" onclick="this.nextElementSibling.style.display='block'">Show Answer</button><div class="ans">Answer: <b>${esc(q[1])}</b></div></div>`).join('')}</div>`}
function setLang(x){lang=x;render()}
function setPart(x){part=x;render()}
function teacher(d){let lines=lang==='hi'?[`आज हम ${topic} पढ़ेंगे।`,`सबसे पहले इसका मुख्य अर्थ समझें।`,d.hi,`अब तीन बातों को याद रखें।`,`अब एक छोटा MCQ करें और उत्तर सोचें।`]:[`Today we will study ${topic}.`,`First understand the core idea.`,d.en,`Now remember the key points.`,`Finish with a quick topic-linked question.`];return `<div class="teacher"><h3>🎓 AI Teacher Lesson — ${lang==='hi'?'Hindi':'English'}</h3><div class="stage" id="stage">${esc(lines[lesson])}</div><div class="progress"><i style="width:${((lesson+1)/lines.length)*100}%"></i></div><button class="btn" onclick="speak(${JSON.stringify(lines[lesson])})">🔊 Speak</button><button class="btn" onclick="prevLesson()">◀</button><button class="btn" onclick="nextLesson(${lines.length})">▶</button><p class="small" style="color:#cbd5e1">Browser voice available ho to lesson ko audio ke saath suna sakte hain. यह text-to-speech lesson है, वास्तविक recorded video नहीं.</p></div>`}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang==='hi'?'hi-IN':'en-IN';speechSynthesis.speak(u)}
function nextLesson(n){lesson=(lesson+1)%n;render()};function prevLesson(){lesson=Math.max(0,lesson-1);render()}
function siteSearch(q){q=q.toLowerCase().trim();if(!q){render();return}let hits=[];for(let e of Object.keys(E)){if(e.toLowerCase().includes(q))hits.push(['exam',e,e]);for(let [s,ts] of Object.entries(subjectsOf(e))){if(s.toLowerCase().includes(q))hits.push(['subject',e,s]);for(let t of ts)if(t.toLowerCase().includes(q))hits.push(['topic',e,s,t])}}document.getElementById('app').innerHTML=`<div class="box"><h2>🔎 Search Results</h2>${hits.slice(0,80).map(h=>h[0]==='exam'?`<div class="topic" onclick="openExam(val('${arg(h[1])}'))"><b>${esc(h[1])}</b></div>`:h[0]==='subject'?`<div class="topic" onclick="openExam(val('${arg(h[1])}'));setTimeout(()=>openSubject(val('${arg(h[2])}')),0)"><b>${esc(h[1])}</b> — ${esc(h[2])}</div>`:`<div class="topic" onclick="openExam(val('${arg(h[1])}'));setTimeout(()=>{openSubject(val('${arg(h[2])}'));setTimeout(()=>openTopic(val('${arg(h[3])}')),0)},0)"><b>${esc(h[3])}</b><div class="small">${esc(h[1])} → ${esc(h[2])}</div></div>`).join('')||'<p>No result.</p>'}</div>`}
render();
</script></body></html>
