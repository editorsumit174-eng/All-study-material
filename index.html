*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}

header h1{margin:0 0 8px;font-size:30px} header p{margin:0;opacity:.92}
.container{max-width:1180px;margin:auto;padding:16px}
.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card,.box{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 18px #00000012;border:1px solid #e5e7eb}
.card{cursor:pointer}.card:hover{transform:translateY(-2px);border-color:#2563eb}
.card h3{margin:0 0 8px}.card p{margin:0;color:#64748b;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#2563eb;color:#fff;margin:4px}
.btn.secondary{background:#475569}.btn.back{background:#111827}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
.tab{background:#e5e7eb;color:#111827;border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
.tab.active{background:#2563eb;color:#fff}
.topic{background:#fff;padding:14px;border-radius:12px;margin:8px 0;cursor:pointer;border:1px solid #e5e7eb}
.topic:hover{border-color:#2563eb}.note{line-height:1.7}.mcq{border:1px solid #e5e7eb;padding:14px;border-radius:12px;margin:10px 0}
.answer{background:#ecfdf5;border-left:4px solid #10b981;padding:10px;margin-top:8px}
.small{color:#64748b;font-size:13px}.hero{background:linear-gradient(135deg,#eff6ff,#fff);border:1px solid #dbeafe}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:999px;font-size:12px;margin:3px}
.link{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:700;margin:5px 8px 5px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.meta div{background:#f8fafc;border-radius:10px;padding:12px}.status{font-weight:700}
.warning{background:#fff7ed;border-left:4px solid #f97316;padding:12px;border-radius:8px}
footer{text-align:center;padding:25px;color:#64748b}
ul{line-height:1.65} li{margin:5px 0}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
@media(max-width:600px){header h1{font-size:24px}.container{padding:10px}.card{padding:15px}}
</style>

let currentExam = null;
let currentSubject = null;
let currentTopic = null;
let currentTab = "notes";
let mockQuestions = [];
let mockScore = 0;


// =========================
// HOME
// =========================

function home(){

currentExam=null;
currentSubject=null;
currentTopic=null;

let groups={};

Object.entries(exams).forEach(([name,e])=>{
if(!groups[e.category]) groups[e.category]=[];
groups[e.category].push(name);
});

let html=`
<div class="box hero">
<h2>🎯 Government Exam Preparation Portal</h2>
<p>Exam चुनें → Subject चुनें → Topic खोलें → Notes, Practice, Formula, Revision और Mock Test करें.</p>
<div class="warning">
<strong>Important:</strong> exact exam pattern, eligibility, fees, vacancies और dates हमेशा latest official notification से verify करें.
</div>
</div>
<br>
`;

Object.entries(groups).forEach(([category,names])=>{

html+=`
<div class="box">
<h2>${category}</h2>
<div class="grid">
`;

names.forEach(name=>{
let e=exams[name];
html+=`
<div class="card" onclick="openExam('${esc(name)}')">
<h3>${name}</h3>
<p>${e.desc}</p>
<br>
<span class="badge">${Object.keys(e.subjects).length} Subjects</span>
<span class="badge">${Object.values(e.subjects).flat().length} Topics</span>
</div>
`;
});

html+=`</div></div><br>`;
});

document.getElementById("app").innerHTML=html;
}


// =========================
// EXAM PAGE
// =========================

function openExam(name){

currentExam=name;

let e=exams[name];

let html=`
<button class="btn back" onclick="home()">← सभी Exams</button>

<div class="box hero">
<h2>${name}</h2>
<p>${e.desc}</p>

<div class="meta">
<div><b>Category</b><br>${e.category}</div>
<div><b>Eligibility</b><br>${e.eligibility}</div>
<div><b>Fee</b><br>${e.fee}</div>
<div><b>Pattern</b><br>${e.pattern}</div>
</div>

<br>

<a class="link" href="${e.official}" target="_blank">🌐 Official Website</a>
<a class="link" href="${e.notification}" target="_blank">📢 Notification</a>
<a class="link" href="${e.apply}" target="_blank">📝 Apply / Recruitment</a>

<div class="warning">
Official notification को final source मानें. Dates, fee, vacancies और exact exam pattern बदल सकते हैं.
</div>
</div>

<div class="box">
<h2>📚 Subjects</h2>
<div class="grid">
`;

Object.entries(e.subjects).forEach(([subject,topics])=>{

html+=`
<div class="card" onclick="openSubject('${esc(subject)}')">
<h3>${subject}</h3>
<p>${topics.length} topics</p>
<div>
${topics.slice(0,5).map(t=>`<span class="badge">${t}</span>`).join("")}
</div>
</div>
`;

});

html+=`</div></div>`;

document.getElementById("app").innerHTML=html;
}


// =========================
// SUBJECT PAGE
// =========================

function openSubject(subject){

currentSubject=subject;

let topics=exams[currentExam].subjects[subject];

let html=`
<button class="btn back" onclick="openExam('${esc(currentExam)}')">← ${currentExam}</button>

<div class="box hero">
<h2>${subject}</h2>
<p>Topic चुनें और Notes, Practice, Formula, Revision तथा Mock Test करें.</p>
</div>

<div class="box">
`;

topics.forEach((topic,index)=>{

html+=`
<div class="topic" onclick="openTopic('${esc(topic)}')">
<strong>${index+1}. ${topic}</strong>
<span class="small"> — Open study material</span>
</div>
`;

});

html+=`</div>`;

document.getElementById("app").innerHTML=html;
}


// =========================
// TOPIC PAGE
// =========================

function openTopic(topic){

currentTopic=topic;
currentTab="notes";

renderTopic();
}


function renderTopic(){

let topic=currentTopic;

let data=study[topic] || genericStudy(topic);

let html=`
<button class="btn back" onclick="openSubject('${esc(currentSubject)}')">
← ${currentSubject}
</button>

<div class="box hero">
<h2>${topic}</h2>
<p>${currentExam} → ${currentSubject} → ${topic}</p>
</div>

<div class="tabs">
<button class="tab ${currentTab==="notes"?"active":""}" onclick="setTab('notes')">📖 Notes</button>
<button class="tab ${currentTab==="practice"?"active":""}" onclick="setTab('practice')">✍️ Practice</button>
<button class="tab ${currentTab==="important"?"active":""}" onclick="setTab('important')">⭐ Important</button>
<button class="tab ${currentTab==="formula"?"active":""}" onclick="setTab('formula')">📐 Formula</button>
<button class="tab ${currentTab==="revision"?"active":""}" onclick="setTab('revision')">🔁 Revision</button>
<button class="tab ${currentTab==="mock"?"active":""}" onclick="startMock()">📝 Mock Test</button>
</div>

<div id="topicContent" class="box">
${renderTab(data)}
</div>
`;

document.getElementById("app").innerHTML=html;
}


function setTab(tab){

currentTab=tab;
renderTopic();
}


function renderTab(data){

if(currentTab==="notes"){
return data.notes || `<h3>${currentTopic}</h3><p>इस topic के लिए detailed notes तैयार करें और latest official syllabus के अनुसार पढ़ें.</p>`;
}

if(currentTab==="formula"){
if(!data.formula || !data.formula.length)
return `<h3>📐 Formula</h3><p>इस topic के लिए मुख्य formula लागू नहीं है.</p>`;

return `
<h3>📐 Important Formula</h3>
<ul>${data.formula.map(x=>`<li><code>${x}</code></li>`).join("")}</ul>
`;
}

if(currentTab==="important"){

return `
<h3>⭐ Important Points</h3>
<ul>
<li>Topic की basic definitions पहले याद करें.</li>
<li>Previous-year questions में बार-बार आने वाले concepts को mark करें.</li>
<li>Calculation वाले questions में units और signs check करें.</li>
<li>Current-affairs आधारित topics को latest information से update करें.</li>
<li>Exam की official notification में दिए syllabus को priority दें.</li>
</ul>
`;
}

if(currentTab==="revision"){

return `
<h3>🔁 Quick Revision</h3>
<div class="warning">
<strong>30-second revision:</strong> पहले definition → फिर formula/rule → फिर 2-3 examples → फिर PYQ.
</div>
<br>
<ul>
<li>आज पढ़ा हुआ topic उसी दिन revise करें.</li>
<li>1 दिन, 7 दिन और 30 दिन के revision cycle का उपयोग करें.</li>
<li>गलत questions की अलग notebook/list रखें.</li>
</ul>
`;
}

if(currentTab==="practice"){

let q=(data.mcq||[]);

if(!q.length){
return `
<h3>✍️ Practice</h3>
<p>इस topic के लिए अभी generic practice guidance उपलब्ध है.</p>
<ul>
<li>Concept-based questions solve करें.</li>
<li>Previous-year questions लगाएँ.</li>
<li>गलत answers का कारण लिखें.</li>
</ul>
`;
}

return `
<h3>✍️ Practice Questions</h3>
${q.map((x,i)=>`
<div class="mcq">
<strong>Q${i+1}. ${x[0]}</strong>
<p>A) ${x[1]}</p>
<p>B) ${x[2]}</p>
<p>C) ${x[3]}</p>
<p>D) ${x[4]}</p>
<details>
<summary>Answer देखें</summary>
<div class="answer">Correct Answer: ${x[5]}</div>
</details>
</div>
`).join("")}
`;
}

if(currentTab==="mock"){

return `
<h3>📝 Mock Test</h3>
<p>नीचे दिए button से इस topic का timed mock शुरू करें.</p>
<button class="btn" onclick="startMock()">Start Mock Test</button>
`;
}

return "";
}


// =========================
// MOCK TEST
// =========================

function startMock(){

let data=study[currentTopic] || genericStudy(currentTopic);

let source=data.mcq || [];

if(!source.length){

alert("इस topic के लिए अभी mock questions उपलब्ध नहीं हैं.");
return;

}

mockQuestions=source.map(x=>({
q:x[0],
options:[x[1],x[2],x[3],x[4]],
answer:x[5]
}));

mockScore=0;

renderMock();
}


function renderMock(){

let html=`
<button class="btn back" onclick="openTopic('${esc(currentTopic)}')">← Topic</button>

<div class="box hero">
<h2>📝 ${currentTopic} Mock Test</h2>
<p>${currentExam} • ${currentSubject}</p>
</div>

<form id="mockForm">

`;

mockQuestions.forEach((q,i)=>{

html+=`
<div class="mcq">
<strong>Q${i+1}. ${q.q}</strong>

<label><p><input type="radio" name="q${i}" value="A"> A) ${q.options[0]}</p></label>
<label><p><input type="radio" name="q${i}" value="B"> B) ${q.options[1]}</p></label>
<label><p><input type="radio" name="q${i}" value="C"> C) ${q.options[2]}</p></label>
<label><p><input type="radio" name="q${i}" value="D"> D) ${q.options[3]}</p></label>

</div>
`;

});

html+=`
<button type="button" class="btn" onclick="submitMock()">Submit Mock</button>
</form>

<div id="mockResult"></div>
`;

document.getElementById("app").innerHTML=html;
}


function submitMock(){

let score=0;

mockQuestions.forEach((q,i)=>{

let selected=document.querySelector(`input[name="q${i}"]:checked`);

if(selected && selected.value===q.answer){
score++;
}

});

mockScore=score;

let percentage=Math.round((score/mockQuestions.length)*100);

document.getElementById("mockResult").innerHTML=`
<div class="box hero">
<h2>🎯 Result</h2>
<h3>${score} / ${mockQuestions.length}</h3>
<p>Score: ${percentage}%</p>

${
percentage>=80
? `<div class="answer">बहुत अच्छा! इसी तरह practice जारी रखें.</div>`
: percentage>=50
? `<div class="warning">अच्छा प्रयास। जिन questions में गलती हुई उन्हें दोबारा revise करें.</div>`
: `<div class="warning">Concepts को फिर से पढ़ें और mock दोबारा attempt करें.</div>`
}

<br>
<button class="btn" onclick="startMock()">Retry</button>
<button class="btn secondary" onclick="openTopic('${esc(currentTopic)}')">Review Topic</button>
</div>
`;
}


// =========================
// SEARCH
// =========================

function searchAll(){

let q=document.getElementById("search").value.trim().toLowerCase();

if(!q){

if(currentExam) openExam(currentExam);
else home();

return;
}

let results=[];

Object.entries(exams).forEach(([name,e])=>{

if(name.toLowerCase().includes(q) ||
e.desc.toLowerCase().includes(q)){

results.push({
type:"Exam",
name:name,
extra:e.category
});

}

Object.entries(e.subjects).forEach(([subject,topics])=>{

if(subject.toLowerCase().includes(q)){

results.push({
type:"Subject",
name:subject,
exam:name,
extra:`${topics.length} topics`
});

}

topics.forEach(topic=>{

if(topic.toLowerCase().includes(q)){

results.push({
type:"Topic",
name:topic,
exam:name,
subject:subject,
extra:"Study Material"
});

}

});

});

});

let html=`
<div class="box">
<h2>🔎 Search Results</h2>
<p>${results.length} result(s) मिले.</p>
`;

if(!results.length){

html+=`
<div class="warning">
कोई result नहीं मिला. Exam या topic का दूसरा keyword try करें.
</div>
`;

}else{

results.slice(0,100).forEach(r=>{

if(r.type==="Exam"){

html+=`
<div class="topic" onclick="openExam('${esc(r.name)}')">
<strong>📚 ${r.name}</strong>
<div class="small">${r.extra}</div>
</div>
`;

}else if(r.type==="Subject"){

html+=`
<div class="topic" onclick="openExam('${esc(r.exam)}')">
<strong>📖 ${r.name}</strong>
<div class="small">${r.exam} • ${r.extra}</div>
</div>
`;

}else{

html+=`
<div class="topic" onclick="openExam('${esc(r.exam)}');setTimeout(()=>openSubject('${esc(r.subject)}'),0)">
<strong>📝 ${r.name}</strong>
<div class="small">${r.exam} • ${r.subject}</div>
</div>
`;

}

});

}

html+=`</div>`;

document.getElementById("app").innerHTML=html;

function esc(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}
