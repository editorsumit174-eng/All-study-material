<title>All Study Material</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#111827,#2563eb);color:white;text-align:center;padding:25px 15px}
h1{margin:0 0 8px;font-size:30px}header p{margin:0;font-size:17px}
main{max-width:1200px;margin:auto;padding:15px}
.search{width:100%;padding:15px;border:1px solid #ccc;border-radius:12px;font-size:16px;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card,.box{background:white;border:1px solid #e5e7eb;border-radius:15px;padding:17px;box-shadow:0 4px 15px #0001}
.card{cursor:pointer}.card:hover{border-color:#2563eb;transform:translateY(-2px)}
.card h3{margin:0 0 7px}.card p{color:#64748b;font-size:14px}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 8px;border-radius:20px;font-size:12px;margin:2px}
.btn{background:#2563eb;color:white;border:0;border-radius:9px;padding:10px 14px;margin:4px;cursor:pointer}
.back{background:#111827}.green{background:#059669}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}
.tab{border:0;padding:10px 12px;border-radius:9px;cursor:pointer;background:#e5e7eb}
.tab.active{background:#2563eb;color:#fff}
.topic{padding:14px;background:white;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;cursor:pointer}
.topic:hover{border-color:#2563eb}
.mcq{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}
.answer{background:#ecfdf5;padding:10px;border-left:4px solid #10b981;margin-top:8px}
.warning{background:#fff7ed;padding:12px;border-left:4px solid #f97316;border-radius:8px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.meta div{background:#f8fafc;padding:12px;border-radius:9px}
a{color:#1d4ed8;font-weight:bold;text-decoration:none;margin-right:12px}
footer{text-align:center;color:#64748b;padding:25px}
@media(max-width:600px){h1{font-size:24px}}
</style>
</head>

/* ================= APP ================= */

let exam="",subject="",topic="",tab="notes",questions=[];

function esc(x){
return String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function home(){

let groups={};

for(let x in exams){
let c=exams[x].c;
if(!groups[c])groups[c]=[];
groups[c].push(x);
}

let h=`
<div class="box">
<h2>🎯 Government Exam Preparation Portal</h2>
<p>Exam चुनें → Subject → Topic → Notes / Practice / Formula / Revision / Mock Test</p>
<div class="warning"><b>Important:</b> Exact fee, dates, vacancies, eligibility और exam pattern latest official notification से check करें.</div>
</div><br>`;

for(let c in groups){
h+=`<div class="box"><h2>${c}</h2><div class="grid">`;
groups[c].forEach(x=>{
let e=exams[x];
let count=Object.values(e.s).flat().length;
h+=`<div class="card" onclick="openExam('${esc(x)}')">
<h3>${x}</h3><p>Eligibility: ${e.e}</p>
<span class="badge">${Object.keys(e.s).length} Subjects</span>
<span class="badge">${count} Topics</span>
</div>`;
});
h+=`</div></div><br>`;
}

app.innerHTML=h;
}

function openExam(x){

exam=x;
let e=exams[x];

let h=`
<button class="btn back" onclick="home()">← सभी Exams</button>
<div class="box hero">
<h2>${x}</h2>
<p>${e.c} • Government Exam Preparation</p>
<div class="meta">
<div><b>Eligibility</b><br>${e.e}</div>
<div><b>Subjects</b><br>${Object.keys(e.s).length}</div>
<div><b>Topics</b><br>${Object.values(e.s).flat().length}</div>
<div><b>Official</b><br>Government portal</div>
</div>
<br>
<a href="${e.u}" target="_blank">🌐 Official Website</a>
<a href="${e.u}" target="_blank">📢 Notification</a>
<a href="${e.u}" target="_blank">📝 Apply / Recruitment</a>
<br><br>
<div class="warning">Official notification को final source मानें। Dates, fee, vacancies और exact pattern बदल सकते हैं.</div>
</div><br>
<div class="box"><h2>📚 Subjects</h2><div class="grid">`;

for(let s in e.s){
h+=`<div class="card" onclick="openSubject('${esc(s)}')">
<h3>${s}</h3><p>${e.s[s].length} Topics</p>
${e.s[s].slice(0,5).map(t=>`<span class="badge">${t}</span>`).join("")}
</div>`;
}

h+=`</div></div>`;
app.innerHTML=h;
}

function openSubject(s){

subject=s;

let h=`
<button class="btn back" onclick="openExam('${esc(exam)}')">← ${exam}</button>
<div class="box hero"><h2>${s}</h2><p>Topic चुनें और पूरा study material देखें.</p></div>
<div class="box">`;

exams[exam].s[s].forEach((t,i)=>{
h+=`<div class="topic" onclick="openTopic('${esc(t)}')">
<b>${i+1}. ${t}</b>
</div>`;
});

h+=`</div>`;
app.innerHTML=h;
}

function getData(){

if(common[topic])return common[topic];

return{
n:`<b>${topic}</b> के लिए preparation में basic concepts, definitions, examples और previous-year questions को priority दें। Latest official syllabus को final authority मानें।`,
f:[],
q:[]
};
}

function openTopic(t){

topic=t;
tab="notes";
renderTopic();
}

function renderTopic(){

let d=getData();

let h=`
<button class="btn back" onclick="openSubject('${esc(subject)}')">← ${subject}</button>
<div class="box hero">
<h2>${topic}</h2>
<p>${exam} → ${subject} → ${topic}</p>
</div>

<div class="tabs">
<button class="tab ${tab=="notes"?"active":""}" onclick="setTab('notes')">📖 Notes</button>
<button class="tab ${tab=="practice"?"active":""}" onclick="setTab('practice')">✍️ Practice</button>
<button class="tab ${tab=="important"?"active":""}" onclick="setTab('important')">⭐ Important</button>
<button class="tab ${tab=="formula"?"active":""}" onclick="setTab('formula')">📐 Formula</button>
<button class="tab ${tab=="revision"?"active":""}" onclick="setTab('revision')">🔁 Revision</button>
<button class="tab ${tab=="mock"?"active":""}" onclick="startMock()">📝 Mock Test</button>
</div>
<div class="box">`;

if(tab=="notes"){
h+=`<h3>📖 Notes</h3><p>${d.n}</p>`;
}

if(tab=="formula"){
h+=`<h3>📐 Important Formula</h3>`;
h+=d.f.length?`<ul>${d.f.map(x=>`<li><code>${x}</code></li>`).join("")}</ul>`:"<p>इस topic में कोई fixed formula नहीं है.</p>";
}

if(tab=="important"){
h+=`<h3>⭐ Important Points</h3>
<ul>
<li>Basic definition और concepts clear करें.</li>
<li>Previous Year Questions जरूर लगाएँ.</li>
<li>गलत questions की अलग revision list बनाएं.</li>
<li>Current-affairs topics को latest information से update करें.</li>
<li>Official notification के syllabus को priority दें.</li>
</ul>`;
}

if(tab=="revision"){
h+=`<h3>🔁 Quick Revision</h3>
<ul>
<li>Definition revise करें.</li>
<li>Formula/rules देखें.</li>
<li>2-3 questions solve करें.</li>
<li>गलत questions दोबारा करें.</li>
<li>1 दिन और 7 दिन बाद revision करें.</li>
</ul>`;
}

if(tab=="practice"){

if(!d.q.length)h+=`<h3>✍️ Practice</h3><p>इस topic के लिए concept-based practice और PYQ solve करें.</p>`;

d.q.forEach((q,i)=>{
h+=`<div class="mcq"><b>Q${i+1}. ${q[0]}</b>
<p>A) ${q[1]}</p><p>B) ${q[2]}</p><p>C) ${q[3]}</p><p>D) ${q[4]}</p>
<details><summary>Answer देखें</summary><div class="answer">Correct Answer: ${q[5]}</div></details>
</div>`;
});

}

if(tab=="mock"){
h+=`<h3>📝 Mock Test</h3>
<p>इस topic के available questions से mock test शुरू करें.</p>
<button class="btn green" onclick="startMock()">Start Mock Test</button>`;
}

h+=`</div>`;
app.innerHTML=h;
}

function setTab(x){
tab=x;
renderTopic();
}

function startMock(){

let d=getData();

if(!d.q.length){
alert("इस topic के लिए अभी mock questions उपलब्ध नहीं हैं।");
return;
}

questions=d.q;

let h=`
<button class="btn back" onclick="openTopic('${esc(topic)}')">← Topic</button>
<div class="box hero"><h2>📝 ${topic} Mock Test</h2><p>${exam} • ${subject}</p></div>
<form id="test">`;

questions.forEach((q,i)=>{
h+=`<div class="mcq">
<b>Q${i+1}. ${q[0]}</b>
<label><p><input type="radio" name="q${i}" value="A"> A) ${q[1]}</p></label>
<label><p><input type="radio" name="q${i}" value="B"> B) ${q[2]}</p></label>
<label><p><input type="radio" name="q${i}" value="C"> C) ${q[3]}</p></label>
<label><p><input type="radio" name="q${i}" value="D"> D) ${q[4]}</p></label>
</div>`;
});

h+=`<button type="button" class="btn green" onclick="submitTest()">Submit Mock</button></form>
<div id="result"></div>`;
app.innerHTML=h;
}

function submitTest(){

let score=0;

questions.forEach((q,i)=>{
let a=document.querySelector('input[name="q'+i+'"]:checked');
if(a&&a.value==q[5])score++;
});

let p=Math.round(score/questions.length*100);

result.innerHTML=`
<div class="box">
<h2>🎯 Result</h2>
<h3>${score} / ${questions.length}</h3>
<p>Score: ${p}%</p>
${p>=80?
'<div class="answer">बहुत अच्छा! आपकी preparation अच्छी जा रही है.</div>':
p>=50?
'<div class="warning">अच्छा प्रयास। गलत questions revise करें.</div>':
'<div class="warning">Concepts दोबारा पढ़ें और mock फिर से लगाएँ.</div>'}
<br>
<button class="btn" onclick="startMock()">Retry</button>
<button class="btn back" onclick="openTopic('${esc(topic)}')">Review</button>
</div>`;
}


/* ================= SEARCH ================= */

function search(){

let q=document.getElementById("search").value.toLowerCase().trim();

if(!q){
home();
return;
}

let r=[];

for(let e in exams){

if(e.toLowerCase().includes(q))
r.push(["exam",e]);

for(let s in exams[e].s){

if(s.toLowerCase().includes(q))
r.push(["subject",e,s]);

exams[e].s[s].forEach(t=>{
if(t.toLowerCase().includes(q))
r.push(["topic",e,s,t]);
});

}
}

let h=`<div class="box"><h2>🔎 Search Results</h2>
<p>${r.length} result(s)</p>`;

if(!r.length){
h+=`<div class="warning">कोई result नहीं मिला.</div>`;
}else{

r.slice(0,100).forEach(x=>{

if(x[0]=="exam")
h+=`<div class="topic" onclick="openExam('${esc(x[1])}')">📚 <b>${x[1]}</b></div>`;

if(x[0]=="subject")
h+=`<div class="topic" onclick="openSubjectFromSearch('${esc(x[1])}','${esc(x[2])}')">
📖 <b>${x[2]}</b><br><small>${x[1]}</small></div>`;

if(x[0]=="topic")
h+=`<div class="topic" onclick="openTopicFromSearch('${esc(x[1])}','${esc(x[2])}','${esc(x[3])}')">
📝 <b>${x[3]}</b><br><small>${x[1]} → ${x[2]}</small></div>`;

});
}

h+=`</div>`;
app.innerHTML=h;
}

function openSubjectFromSearch(e,s){
exam=e;
openSubject(s);
}

function openTopicFromSearch(e,s,t){
exam=e;
subject=s;
openTopic(t);
}


/* ================= START ================= */

home();

</script>
</body>
</html>
