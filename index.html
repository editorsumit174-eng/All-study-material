function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function getContent(topic,subject){
  if(content[topic]) return content[topic];
  for(const k of Object.keys(extraMaterial)) if(topic.toLowerCase().includes(k.toLowerCase())||subject.toLowerCase().includes(k.toLowerCase())){
    return {note:extraMaterial[k],imp:fallback.imp,qs:fallback.qs,formula:fallback.formula};
  }
  return fallback;
}

 const groups={};Object.entries(exams).forEach(([e,x])=>(groups[x.category]??=[]).push(e));

 const ts=exams[currentExam].subjects[currentSubject];
 let h=`<button class="btn back" onclick="openExam('${esc(currentExam)}')">← ${esc(currentExam)}</button>
 <div class="box"><h2>${esc(currentSubject)}</h2><p class="small">हर listed topic के लिए notes, practice, important, formula, revision और mock उपलब्ध है.</p></div>`;
 ts.forEach((t,i)=>h+=`<div class="topic" onclick="openTopic('${esc(t)}')"><b>${i+1}. ${esc(t)}</b><div class="small">Notes • Practice • Important • Formula • Revision • Mock</div></div>`);
 document.getElementById("app").innerHTML=h;
}
function makeMockQuestions(t){
 const c=getContent(t,currentSubject);
 const base=c.qs.map(x=>({q:x[0],a:x[1]}));
 const generic=[
  {q:`${t}: सबसे पहले किस चीज़ को समझना चाहिए?`,a:"Concept"},
  {q:`${t}: practice के बाद क्या maintain करना useful है?`,a:"Error-log"},
  {q:`${t}: exact latest exam rule कहाँ verify करें?`,a:"Official notification"}
 ];
 return [...base,...generic].sort(()=>Math.random()-0.5).slice(0,Math.min(8,base.length+generic.length));
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startMock(){clearInterval(mock.timer);mock={qs:makeMockQuestions(currentTopic),i:0,answers:[],score:0,done:false,time:300,timer:null};currentPart="mock";render();mock.timer=setInterval(()=>{mock.time--;const e=document.getElementById("timer");if(e)e.textContent=fmt(mock.time);if(mock.time<=0)submitMock()},1000)}
function ans(v){mock.answers[mock.i]=v}
function nextQ(){if(mock.i<mock.qs.length-1){mock.i++;render()}}
function prevQ(){if(mock.i>0){mock.i--;render()}}
function submitMock(){clearInterval(mock.timer);mock.done=true;mock.score=mock.answers.reduce((n,a,i)=>n+(a===mock.qs[i]?.a?1:0),0);render()}
function renderTopic(){
 const c=getContent(currentTopic,currentSubject);
 let h=`<button class="btn back" onclick="openSubject('${esc(currentSubject)}')">← Topics</button>
 <div class="box"><h2>${esc(currentTopic)}</h2><p class="small">${esc(currentExam)} • ${esc(currentSubject)}</p>
 <div class="tabs">
 <button class="tab ${currentPart==="notes"?"active":""}" onclick="showPart('notes')">📖 Notes</button>
 <button class="tab ${currentPart==="practice"?"active":""}" onclick="showPart('practice')">📝 Practice</button>
 <button class="tab ${currentPart==="important"?"active":""}" onclick="showPart('important')">⭐ Important</button>
 <button class="tab ${currentPart==="formula"?"active":""}" onclick="showPart('formula')">📐 Formula</button>
 <button class="tab ${currentPart==="revision"?"active":""}" onclick="showPart('revision')">⚡ Revision</button>
 <button class="tab ${currentPart==="handwritten"?"active":""}" onclick="showPart('handwritten')">✍️ Handwritten</button>
 <button class="tab ${currentPart==="teacher"?"active":""}" onclick="showPart('teacher')">🎥 AI Teacher</button>
 <button class="tab ${currentPart==="mock"?"active":""}" onclick="showPart('mock')">🧪 Mock Test</button>
 </div></div>`;
 if(currentPart==="notes") h+=`<div class="box note"><h3>📖 Notes</h3><p>${esc(c.note)}</p><h3>Study Method</h3><p>Concept → standard example → PYQ pattern → timed practice → error-log → revision.</p><p class="small">जहाँ topic-specific fact/formula चाहिए, उसे standard textbook या official syllabus/source से verify करके अपनी PDF/notes library में जोड़ें.</p></div>`;
 if(currentPart==="important") h+=`<div class="box"><h3>⭐ Important Points</h3><ul>${c.imp.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
 if(currentPart==="practice") h+=`<div class="box"><h3>📝 Practice Questions</h3>${c.qs.map((q,i)=>`<div class="mcq"><b>Q${i+1}. ${esc(q[0])}</b><div class="answer">Answer: <b>${esc(q[1])}</b></div></div>`).join("")}</div>`;
 if(currentPart==="formula") h+=`<div class="box"><h3>📐 Formula / Rules</h3><ul>${c.formula.map(x=>`<li><b>${esc(x)}</b></li>`).join("")}</ul></div>`;
 if(currentPart==="revision") h+=`<div class="box"><h3>⚡ 5-Minute Revision</h3><ol><li>Concept/definition revise</li><li>Formula/key facts revise</li><li>Important points बोलकर recall करो</li><li>2–3 practice questions solve करो</li><li>गलतियों को error-log में लिखो</li></ol></div>`;
 if(currentPart==="handwritten") h+=`<div class="box"><button class="btn printbtn" onclick="printNotes()">🖨️ Print / Save PDF</button><h3>✍️ Handwritten-Style Notes</h3><div class="handnote"><h3>📌 ${esc(currentTopic)}</h3><p><b>Definition / Concept:</b> ${esc(c.note)}</p><p><b>Important:</b> ${c.imp.map(x=>'• '+x).join('<br>')}</p><p><b>Formula / Rule:</b> ${c.formula.length?c.formula.map(x=>'• '+x).join('<br>'):'इस topic के fixed formulas नहीं हैं; rules और examples revise करें.'}</p><p><b>Practice:</b> ${c.qs.length?c.qs.map((x,i)=>(i+1)+'. '+x[0]+' → '+x[1]).join('<br>'):'PYQ और topic-wise practice जरूर करें.'}</p></div></div>`;
 if(currentPart==="teacher") h+=teacherHTML(c);
 if(currentPart==="mock"){
   if(!mock.qs.length) h+=`<div class="box"><h3>🧪 Topic Mock Test</h3><p>Original practice questions • 5-minute timer • automatic score.</p><button class="btn" onclick="startMock()">▶ Start Mock</button></div>`;
   else if(mock.done) h+=`<div class="box"><h3>🏆 Result</h3><div style="font-size:34px;font-weight:800">${mock.score}/${mock.qs.length}</div><p>${mock.score>=6?"Excellent!":"Wrong answers revise karke retry karo."}</p><button class="btn" onclick="startMock()">🔄 Retry</button></div>`;
   else {const q=mock.qs[mock.i];h+=`<div class="box"><div style="display:flex;justify-content:space-between"><b>Q${mock.i+1}/${mock.qs.length}</b><b id="timer">${fmt(mock.time)}</b></div><div class="mcq"><h3>${esc(q.q)}</h3><label><input type="radio" name="a" onchange="ans(this.value)" value="${esc(q.a)}"> ${esc(q.a)}</label><br><label><input type="radio" name="a" onchange="ans(this.value)" value="Not sure"> Not sure</label></div><button class="btn secondary" onclick="prevQ()">← Previous</button>${mock.i<mock.qs.length-1?'<button class="btn" onclick="nextQ()">Next →</button>':'<button class="btn" onclick="submitMock()">Submit Test</button>'}</div>`}
 }
 document.getElementById("app").innerHTML=h;
}
function teacherHTML(c){
 const slides=[
  {t:'आज का Topic',x:`${currentTopic} — ${currentSubject}`},
  {t:'Concept',x:c.note},
  {t:'Important Points',x:c.imp.join(' • ')},
  {t:'Formula / Rule',x:c.formula.length?c.formula.join(' • '):'इस topic के लिए मुख्य rule और examples को revise करें.'},
  {t:'Quick Practice',x:c.qs.length?c.qs[0][0]+' Answer: '+c.qs[0][1]:'अब PYQ और timed practice करें.'},
  {t:'Final Revision',x:'Concept समझो → Example करो → PYQ लगाओ → गलती नोट करो → दोबारा revise करो.'}
 ];
 window.teacherSlides=slides;window.teacherIndex=0;
 return `<div class="teacher"><h3>🎥 AI Teacher — Video Lesson</h3><p>यह browser-based AI-style lesson है: topic को slides में समझाता है और device की text-to-speech voice से पढ़कर सुनाता है. किसी API key की जरूरत नहीं.</p><div class="teacher-screen"><div class="teacher-title" id="teacherTitle"></div><div class="teacher-text" id="teacherText"></div></div><div class="progress"><i id="teacherProgress"></i></div><div class="video-controls"><button class="smallbtn primary" onclick="teacherPlay()">▶️ Play Lesson</button><button class="smallbtn" onclick="teacherPrev()">◀ Previous</button><button class="smallbtn" onclick="teacherNext()">Next ▶</button><button class="smallbtn" onclick="speechSynthesis.cancel()">⏹ Stop Voice</button></div></div><div class="box"><h3>🤖 AI Teacher Study Flow</h3><ol><li>Concept explanation</li><li>Important points</li><li>Formula/rules</li><li>Example/PYQ pattern</li><li>Quick revision</li></ol><p class="small">अगर बाद में real AI-generated talking-avatar video चाहिए, तो सुरक्षित तरीका server-side AI/video API integration है; API key को HTML में नहीं रखना चाहिए.</p></div>`;
}
function teacherRender(){
 const s=window.teacherSlides?.[window.teacherIndex];if(!s)return;
 const a=document.getElementById('teacherTitle'),b=document.getElementById('teacherText'),p=document.getElementById('teacherProgress');
 if(a)a.textContent=s.t;if(b)b.textContent=s.x;if(p)p.style.width=((window.teacherIndex+1)/window.teacherSlides.length*100)+'%';
}
function teacherNext(){if(!window.teacherSlides)return;window.teacherIndex=Math.min(window.teacherIndex+1,window.teacherSlides.length-1);teacherRender();}
function teacherPrev(){if(!window.teacherSlides)return;window.teacherIndex=Math.max(window.teacherIndex-1,0);teacherRender();}
function teacherPlay(){
 if(!window.teacherSlides)return; speechSynthesis.cancel(); window.teacherIndex=0; teacherRender();
 const play=()=>{ if(window.teacherIndex>=window.teacherSlides.length)return; const s=window.teacherSlides[window.teacherIndex]; teacherRender(); const u=new SpeechSynthesisUtterance(s.t+'. '+s.x);u.lang='hi-IN';u.rate=.9;u.onend=()=>{window.teacherIndex++;if(window.teacherIndex<window.teacherSlides.length)play();else teacherRender()};speechSynthesis.speak(u);}; play();
}
function printNotes(){window.print()}
function showPart(p){currentPart=p;render();if(p==='teacher')teacherRender()}
function searchAll(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 if(!q){render();return}
 let h=`<div class="box"><h2>🔎 Search Results</h2><p class="small">"${esc(q)}"</p></div>`,count=0;
 Object.entries(exams).forEach(([e,v])=>{
  Object.entries(v.subjects).forEach(([s,ts])=>{
   ts.forEach(t=>{if(e.toLowerCase().includes(q)||s.toLowerCase().includes(q)||t.toLowerCase().includes(q)){count++;h+=`<div class="topic" onclick="openTopicFromSearch('${esc(e)}','${esc(s)}','${esc(t)}')"><b>${esc(t)}</b><div class="small">${esc(e)} → ${esc(s)}</div></div>`}})
  })
 });
 if(!count)h+=`<div class="box">Koi result nahi mila. Dusra keyword try karo.</div>`;
 document.getElementById("app").innerHTML=h;
}
function openTopicFromSearch(e,s,t){currentExam=e;currentSubject=s;currentTopic=t;page="topic";currentPart="notes";render();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
