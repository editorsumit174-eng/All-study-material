const app=document.getElementById("app");

if(page==="home") return renderHome();

if(page==="exam") return renderExam();

if(page==="subject") return renderSubject();

renderTopic();

}

function renderHome(){

let h="<div class='box'><h2>🎯 Exam Select Karo</h2><p class='small'>Neeche kisi bhi exam par tap karke subjects aur chapter-wise material kholo.</p></div><div class='grid'>";

Object.entries(exams).forEach(([e,v])=>{

h+=`<div class="card" onclick="openExam('${esc(e)}')">

<h3>${esc(e)}</h3>

<p>${esc(v.desc)}</p>

<p style="margin-top:10px">

<b>${Object.keys(v.subjects).length}</b> subjects

</p>

</div>`;

});

h+="</div>";

document.getElementById("app").innerHTML=h;

}

function openExam(e){

page="exam";
currentExam=e;

render();

window.scrollTo(0,0);

}

function openSubject(s){

page="subject";
currentSubject=s;

render();

window.scrollTo(0,0);

}

function openTopic(t){

page="topic";
currentTopic=t;
currentPart="notes";

render();

window.scrollTo(0,0);

}

function home(){

page="home";

render();

window.scrollTo(0,0);

}

function renderExam(){

const x=exams[currentExam];

let h=`

<button class="btn back" onclick="home()">← Home</button>

<div class="box">

<h2>${esc(currentExam)}</h2>

<p>${esc(x.desc)}</p>

</div>

<div class="grid">`;

Object.entries(x.subjects).forEach(([s,ts])=>{

h+=`

<div class="card" onclick="openSubject('${esc(s)}')">

<h3>${esc(s)}</h3>

<p>${ts.length} topics</p>

</div>`;

});

h+="</div>";

document.getElementById("app").innerHTML=h;

}

function renderSubject(){

const ts=exams[currentExam].subjects[currentSubject];

let h=`

<button class="btn back" onclick="openExam('${esc(currentExam)}')">

← ${esc(currentExam)}

</button>

<div class="box">

<h2>${esc(currentSubject)}</h2>

<p class="small">Topic select karo.</p>

</div>`;

ts.forEach((t,i)=>{

h+=`

<div class="topic" onclick="openTopic('${esc(t)}')">

<b>${i+1}. ${esc(t)}</b>

<div class="small">

Notes • Practice • Important Points

</div>

</div>`;

});

document.getElementById("app").innerHTML=h;

}

function renderTopic(){

const c=content[currentTopic]||fallback;

let h=`

<button class="btn back" onclick="openSubject('${esc(currentSubject)}')">

← Topics

</button>

<div class="box">

<h2>${esc(currentTopic)}</h2>

<p class="small">

${esc(currentExam)} • ${esc(currentSubject)}

</p>

<div class="tabs">

<button class="tab ${currentPart==="notes"?"active":""}" onclick="showPart('notes')">

📖 Notes

</button>

<button class="tab ${currentPart==="practice"?"active":""}" onclick="showPart('practice')">

📝 Practice

</button>

<button class="tab ${currentPart==="important"?"active":""}" onclick="showPart('important')">

⭐ Important

</button>

</div>

</div>`;

if(currentPart==="notes")

h+=`

<div class="box note">

<h3>📖 Short Notes</h3>

<p>${esc(c.note)}</p>

<h3>Example/Approach</h3>

<p>

Definition ko samjho, formula ya rule ko yaad karo,

phir 2–3 basic examples solve karo.

Uske baad exam-level questions par jao.

</p>

</div>`;

if(currentPart==="important")

h+=`

<div class="box imp">

<h3>⭐ Important Points</h3>

<ul>

${c.imp.map(x=>`<li>${esc(x)}</li>`).join("")}

</ul>

<p class="small">

Revision tip: in points ko short notebook/error-log me revise karo.

</p>

</div>`;

if(currentPart==="practice")

h+=`

<div class="box">

<h3>📝 Practice Questions</h3>

${c.qs.map((q,i)=>`

<div class="mcq">

<b>Q${i+1}. ${esc(q[0])}</b>

<div class="answer">

Answer: <b>${esc(q[1])}</b>

</div>

</div>

`).join("")}

</div>`;

document.getElementById("app").innerHTML=h;

}

function showPart(p){

currentPart=p;

render();

}

function searchAll(){

const q=document.getElementById("search").value.toLowerCase().trim();

if(!q){

if(page==="home") renderHome();

return;

}

let h=`

<div class="box">

<h2>🔎 Search Results</h2>

<p class="small">"${esc(q)}" ke results</p>

</div>`;

let count=0;

Object.entries(exams).forEach(([e,v])=>{

const em=e.toLowerCase().includes(q);

Object.entries(v.subjects).forEach(([s,ts])=>{

const sm=s.toLowerCase().includes(q);

ts.forEach(t=>{

if(em||sm||t.toLowerCase().includes(q)){

count++;

h+=`

<div class="topic"

onclick="openTopicFromSearch('${esc(e)}','${esc(s)}','${esc(t)}')">

<b>${esc(t)}</b>

<div class="small">

${esc(e)} → ${esc(s)}

</div>

</div>`;

}

});

});

});

if(!count)

h+=`

<div class='box'>

Koi result nahi mila. Dusra keyword try karo.

</div>`;

document.getElementById("app").innerHTML=h;

}

function openTopicFromSearch(e,s,t){

currentExam=e;
currentSubject=s;
currentTopic=t;
page="topic";
currentPart="notes";

render();

window.scrollTo(0,0);

}

render();

</script>

</body>
</html>
