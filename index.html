<style>
:root{--bg:#F2F6FB;--sf:#fff;--ink:#0F2540;--mu:#566683;--ln:#D9E1EE;--br:#0A5FB4;--bi:#fff;--ac:#F5A524;--ok:#168A5B;--bd:#C93B3B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1628;--sf:#14233B;--ink:#EAF0FA;--mu:#9DB0CF;--ln:#26395A;--br:#6FB0FF;--bi:#0C1628;--ok:#3DD598;--bd:#FF7B7B}}
:root[data-theme=dark]{--bg:#0C1628;--sf:#14233B;--ink:#EAF0FA;--mu:#9DB0CF;--ln:#26395A;--br:#6FB0FF;--bi:#0C1628;--ok:#3DD598;--bd:#FF7B7B}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Mukta,system-ui,sans-serif}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em;font-weight:800}h1{font-size:clamp(26px,5vw,38px)}h2{font-size:22px}h3{font-size:18px}
a{color:var(--br)}button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:flex;min-height:100vh}.col{flex:1;min-width:0}
aside{display:none;width:230px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--sf);border-right:1px solid var(--ln);padding:16px 10px}
aside a,#bn a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:600}
aside a.on{background:var(--br);color:var(--bi)}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}.logo span{background:var(--ac);color:#0F2540;padding:0 6px;border-radius:5px}
#sf{flex:1;display:flex;min-width:0}#si{flex:1;min-width:0;padding:8px 12px;border:1.5px solid var(--ln);border-radius:10px 0 0 10px;background:var(--bg)}
#sf button{border:1.5px solid var(--ln);border-left:0;border-radius:0 10px 10px 0;background:var(--bg);padding:0 12px}
.ib{border:1.5px solid var(--ln);background:var(--bg);border-radius:10px;padding:6px 10px;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 16px 100px}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#bn a{flex:1;flex-direction:column;gap:0;font-size:12px;padding:4px 2px;text-align:center}#bn a.on{color:var(--br)}#bn i{font-style:normal;font-size:20px}
@media(min-width:900px){aside{display:block}#bn{display:none}main{padding-bottom:40px}}
.hero{background:var(--br);color:var(--bi);border-radius:16px;padding:22px;margin-bottom:18px}.hero p{margin:0;opacity:.9;max-width:52ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{display:block;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}.card:hover{border-color:var(--br)}
.card .ic{font-size:26px;display:block}.card small{display:block;color:var(--mu);line-height:1.35;margin-top:2px}
.mu{color:var(--mu)}.panel{background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:6px 16px;margin:12px 0}
.row{padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row b{display:block;color:var(--mu);font-size:14px;font-weight:600}
.tag,.chip{display:inline-block;background:var(--bg);border:1.5px solid var(--ln);border-radius:99px;padding:1px 12px;margin:0 6px 6px 0;font-size:15px;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--br);color:var(--bi);border-color:var(--br)}.tag.s{background:var(--ac);color:#0F2540;border-color:var(--ac)}
.btn{display:inline-block;background:var(--br);color:var(--bi);border:0;border-radius:10px;padding:9px 18px;font-weight:600;text-decoration:none;margin:0 6px 8px 0}.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}.btn:disabled{opacity:.4}
.fs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0 14px}
.fl span{display:block;font-size:14px;color:var(--mu);font-weight:600}.fl select{width:100%;padding:9px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
details{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:8px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600}
details details{background:var(--bg)}ul{margin:6px 0;padding-left:22px;color:var(--mu)}
.qc{background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}.q{font-size:19px;font-weight:600;margin:6px 0 10px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.sel{border-color:var(--br);background:color-mix(in srgb,var(--br) 14%,transparent)}.opt.sel .bub{background:var(--br);border-color:var(--br);color:var(--bi)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.bad{border-color:var(--bd);background:color-mix(in srgb,var(--bd) 14%,transparent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:58px;z-index:4;background:var(--bg);padding:6px 0}.timer{font-size:20px;font-weight:800}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:10px 0}
.pn{height:40px;border:1.5px solid var(--ln);background:var(--sf);border-radius:8px;font-weight:600}.pn.d{background:var(--ok);color:#fff;border-color:var(--ok)}.pn.m{background:var(--ac);color:#0F2540;border-color:var(--ac)}.pn.c{outline:3px solid var(--br)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:12px 0}.stat{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 14px}.stat b{display:block;font-size:26px}
.pre{white-space:pre-line;margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:var(--ac);color:#0F2540;padding:6px 12px;border-radius:8px}
#bn a{min-width:0}#bn a span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{background:var(--ac);color:#0F2540;font-size:12px;font-weight:800;border-radius:6px;padding:0 6px;margin-right:6px}
.ld,.em{text-align:center;color:var(--mu);padding:40px 12px}.em .ic{font-size:40px;display:block}
.av{width:100px;height:100px;border-radius:50%;object-fit:cover;background:var(--ln);display:grid;place-items:center;font-size:40px;flex:none}
.ab{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nimg{display:block;max-width:100%;margin:8px 0;border:1.5px solid var(--ln);border-radius:10px;background:#fff}
.fl input{width:100%;padding:9px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}button.chip{cursor:pointer;font:inherit}.opt:disabled{color:inherit;opacity:1}
@media(max-width:380px){.logo{font-size:16px}.ib{padding:6px 8px}main{padding-left:12px;padding-right:12px}}
textarea{width:100%;font:14px/1.4 monospace;padding:9px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
.av{color:var(--ink);font-weight:800}
</style>
